{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto mt-4">

    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4 tracking-tight">
            Get in <span class="text-green-500">Touch</span>
        </h1>
        <p class="text-slate-500 max-w-xl mx-auto text-lg">
            Ada pertanyaan, saran, atau ingin melaporkan bug? Tim APSMod siap membantu Anda 24/7.
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
        
        <div class="bg-white rounded-3xl p-8 shadow-xl shadow-green-500/5 border border-green-50 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-green-100 rounded-full blur-3xl opacity-50 -mr-10 -mt-10"></div>
            <h2 class="text-2xl font-bold text-slate-800 mb-6 relative z-10">Informasi Kontak</h2>
            <div class="space-y-6 relative z-10">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center text-green-600 shrink-0">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800">Email Support</h3>
                        <p class="text-slate-500 text-sm">oziy@apsmod.com</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 shrink-0">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800">Lokasi</h3>
                        <p class="text-slate-500 text-sm">Karawang, Indonesia</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6">Kirim Pesan</h2>
            <form action="/contact" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Nama Lengkap</label>
                    <input type="text" name="name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-green-500 outline-none transition" placeholder="Ozi Official">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Email Address</label>
                    <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-green-500 outline-none transition" placeholder="contoh@gmail.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Pesan Anda</label>
                    <textarea name="message" rows="4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-green-500 outline-none transition" placeholder="Tulis pesan Anda disini..."></textarea>
                </div>

                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-green-600 transition shadow-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    Kirim Pesan
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
