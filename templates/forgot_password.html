<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - APSMod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="h-screen flex items-center justify-center bg-[#0F172A] relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-green-500 rounded-full blur-[150px] opacity-20"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-500 rounded-full blur-[150px] opacity-20"></div>

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl relative z-10 m-4">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 mb-2">Recovery Mode</h1>
            <p class="text-slate-500 text-sm">Enter your registered email to receive OTP.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-6 p-4 rounded-xl flex items-center gap-3 border {{ 'bg-red-50 text-red-600 border-red-100' if category == 'error' else 'bg-green-50 text-green-600 border-green-100' }}">
                    <span class="font-bold text-lg">{{ '!' if category == 'error' else '✓' }}</span>
                    <span class="text-sm font-medium">{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 ml-1">Email Address</label>
                <div class="relative">
                    <input type="email" name="email" required class="w-full pl-10 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition font-medium text-slate-800" placeholder="admin@apsmod.com">
                    <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-green-600 transition shadow-xl shadow-green-500/10">
                Send OTP Code
            </button>
        </form>

        <div class="mt-8 text-center pt-6 border-t border-slate-100">
            <a href="/login" class="text-xs font-bold text-slate-400 hover:text-slate-600 transition">← Back to Login</a>
        </div>
    </div>
</body>
</html>
