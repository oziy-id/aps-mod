<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - APSMod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="h-screen flex items-center justify-center bg-[#0F172A] relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-green-500 rounded-full blur-[150px] opacity-20"></div>

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl relative z-10 m-4">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 mb-2">Set New Password</h1>
            <p class="text-slate-500 text-sm">Check your email for the OTP code.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-6 p-4 rounded-xl flex items-center gap-3 border {{ 'bg-red-50 text-red-600 border-red-100' if category == 'error' else 'bg-green-50 text-green-600 border-green-100' }}">
                    <span class="font-bold text-lg">{{ '!' if category == 'error' else '✓' }}</span>
                    <span class="text-sm font-medium">{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 ml-1">OTP Code</label>
                <input type="text" name="otp" required class="w-full text-center tracking-[1em] font-mono text-xl py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition text-slate-800 uppercase" placeholder="______" maxlength="6">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 ml-1">New Password</label>
                <input type="password" name="new_password" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition font-medium text-slate-800" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-green-600 transition shadow-xl shadow-green-500/10">
                Update Password
            </button>
        </form>
    </div>
</body>
</html>
